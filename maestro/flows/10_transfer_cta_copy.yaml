appId: qere.music
name: Move tab CTAs and gates
tags:
  - transfer
  - honesty
---
- launchApp:
    clearState: false

- runFlow:
    when:
      visible: "Done"
    commands:
      - tapOn: "Done"

- tapOn:
    id: "plus"
- extendedWaitUntil:
    visible: ".*Move.*|.*перенос.*|.*Transfer.*|.*LIVE TRANSFER.*|Откуда|Куда"
    timeout: 10000

# Archive + advanced can push CTAs far down — scroll aggressively
- repeat:
    times: 10
    commands:
      - scroll

- assertVisible:
    text: ".*Dry-run match preview.*|.*Живой мост.*|.*Начать перенос.*|.*Выберите треки.*"
- assertVisible:
    text: ".*Живой мост.*"
    optional: true
- assertVisible:
    id: "transfer.dry_run"
    optional: true
- assertVisible:
    id: "transfer.live_bridge"
    optional: true
