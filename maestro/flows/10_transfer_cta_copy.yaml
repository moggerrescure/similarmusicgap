appId: qere.music
name: Transfer Create CTAs and gates
tags:
  - transfer
  - honesty
---
- launchApp:
    clearState: false

- runFlow:
    when:
      visible: "Done"
    commands:
      - tapOn: "Done"

- tapOn:
    id: "plus"
- extendedWaitUntil:
    visible: "Create"
    timeout: 10000

- scrollUntilVisible:
    element: "Dry-run match preview"
    direction: DOWN
    timeout: 12000

- assertVisible: "Dry-run match preview"
- assertVisible: "Живой мост"

# Without selection / live pair, live action stays gated
- tapOn:
    text: "Живой мост"
    optional: true
- assertVisible:
    text: ".*Connect.*|.*Client ID.*|.*Demo.*|.*нельзя.*|.*pair.*|.*Spotify.*|.*Apple.*|.*Dry-run.*|.*tracks.*"
    optional: true
