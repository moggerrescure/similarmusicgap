appId: qere.music
name: Conflict policy Skip/Merge honesty
tags:
  - transfer
  - honesty
---
- launchApp:
    clearState: false

- runFlow:
    when:
      visible: "Done"
    commands:
      - tapOn: "Done"

- tapOn:
    id: "plus"
- extendedWaitUntil:
    visible: ".*Transfer.*|.*Create.*|.*LIVE TRANSFER.*|Move|Тонкие|Dry-run|перенос"
    timeout: 10000

# Kick the accordion into view (long Transfer form).
- repeat:
    times: 6
    commands:
      - swipe:
          direction: UP
          duration: 350

- scrollUntilVisible:
    element: ".*Тонкие настройки.*"
    direction: DOWN
    timeout: 20000
    speed: 60
    visibilityPercentage: 40

- tapOn: ".*Тонкие настройки.*"
- waitForAnimationToEnd

- repeat:
    times: 3
    commands:
      - swipe:
          direction: UP
          duration: 300

- extendedWaitUntil:
    visible: "Skip Existing"
    timeout: 12000
- assertVisible: "Skip Existing"
- assertVisible: "Merge"
