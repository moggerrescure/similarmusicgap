appId: qere.music
name: Conflict policy Skip/Merge honesty
tags:
  - transfer
  - honesty
---
- launchApp:
    clearState: false

- runFlow:
    when:
      visible: "Done"
    commands:
      - tapOn: "Done"

- tapOn:
    id: "plus"
- extendedWaitUntil:
    visible: ".*Transfer.*|.*Create.*|.*LIVE TRANSFER.*|Move|Тонкие|Dry-run"
    timeout: 10000

- scrollUntilVisible:
    element: "Тонкие настройки (для опытных)"
    direction: DOWN
    timeout: 15000

- tapOn: "Тонкие настройки (для опытных)"
- waitForAnimationToEnd
- swipe:
    direction: UP
    duration: 400

- extendedWaitUntil:
    visible: "Skip Existing"
    timeout: 10000
- assertVisible: "Skip Existing"
- assertVisible: "Merge"
