appId: qere.music
name: Onboarding → Connect
tags:
  - smoke
  - onboarding
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow

- assertVisible: "MUSIC MIGRATOR"
- assertVisible: "Continue"
- tapOn: "Continue"

- extendedWaitUntil:
    visible: "ISRC MATCHING"
    timeout: 8000
- tapOn: "Next"

- extendedWaitUntil:
    visible: "ON-DEVICE TASTE"
    timeout: 8000
- tapOn: "Explore"

- extendedWaitUntil:
    visible: "CONNECT → SYNC → MOVE"
    timeout: 8000
- tapOn: "Connect Your Music"

# Final onboarding opens Connect sheet
- extendedWaitUntil:
    visible: ".*Connect.*|.*Spotify.*|.*Apple Music.*|Done|STREAMING"
    timeout: 12000
