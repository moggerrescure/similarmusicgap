appId: qere.music
name: Home showcase taps do not crash
tags:
  - home
  - stability
---
- launchApp:
    clearState: false

- runFlow:
    when:
      visible: "Done"
    commands:
      - tapOn: "Done"

- tapOn:
    id: "house.fill"
- scroll
- scroll

# Showcase labels when empty library
- assertVisible:
    text: ".*SHOWCASE.*|.*Synced collection.*|.*Liked Songs.*|.*HERO.*|.*TOP ARTISTS.*|.*designer fixtures.*"
    optional: true

- tapOn:
    text: ".*Synced collection.*|.*Liked Songs.*"
    optional: true

- runFlow:
    when:
      visible: ".*Library is empty.*|.*No tracks.*|Favorites|Saved|Tracks|Playlists|Synced Library"
    commands:
      - assertVisible:
          text: ".*Library is empty.*|.*Connect services.*|Favorites|Saved|Tracks|Synced Library"
          optional: true
      - tapOn:
          text: "Cancel"
          optional: true
      - tapOn:
          text: "Done"
          optional: true
      - tapOn:
          point: "50%,8%"
          optional: true
