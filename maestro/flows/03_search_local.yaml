appId: qere.music
name: Search local library honesty
tags:
  - search
  - honesty
---
- launchApp:
    clearState: false

- runFlow:
    when:
      visible: "Done"
    commands:
      - tapOn: "Done"

# Tab bar Search = magnifyingglass index 1 (0 is Home search-bar icon)
- tapOn:
    id: "magnifyingglass"
    index: 1
- extendedWaitUntil:
    visible: "Browse your library"
    timeout: 10000

- assertVisible:
    id: "search.field"

- tapOn:
    id: "search.field"
- inputText: "zzzz_no_match_soundshift"

- assertVisible:
    text: ".*No matches in synced library.*|.*Library is empty.*|.*Connect services.*"

# Clear via the field clear button if present
- tapOn:
    point: "90%,18%"
    optional: true
